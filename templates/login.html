<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · My Portfolio</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --border: #e3e5e8;
    --ink: #1a1d21; --ink-secondary: #5c6370; --ink-muted: #8b919c;
    --accent: #3b6ff0; --loss: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1e2126; --border: #32363d;
      --ink: #e8eaed; --ink-secondary: #a6acb8; --ink-muted: #7a8089;
      --accent: #7397f5; --loss: #f07868;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 28px; width: 320px; max-width: calc(100vw - 32px);
  }
  h1 { font-size: 19px; font-weight: 650; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--ink-secondary); margin: 0 0 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border);
    border-radius: 7px; background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 16px; padding: 10px; font-size: 14px; font-weight: 600;
    border: none; border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    color: var(--loss); font-size: 13px; margin: 0 0 14px;
    padding: 9px 12px; border-radius: 7px;
    background: color-mix(in srgb, var(--loss) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--loss) 35%, transparent);
  }
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>My Portfolio</h1>
    <p class="sub">Enter your password to continue.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
